<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення пароля — GraphToMusic</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .reset-container h2 {
            margin-bottom: 1.5rem;
        }
        .reset-container input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .reset-container button {
            width: 100%;
            padding: 0.75rem;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .reset-container button:hover {
            background: #5a52d5;
        }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>Новий пароль</h2>
        <input type="password" id="newPassword" placeholder="Введіть новий пароль" />
        <input type="password" id="confirmPassword" placeholder="Підтвердіть пароль" />
        <button onclick="resetPassword()">Зберегти пароль</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            showMessage('Недійсне посилання', 'error');
        } else {
            fetch(`/api/auth/reset-password/${token}`)
                .then(r => r.json())
                .then(data => {
                    if (!data.success) showMessage('Посилання недійсне або прострочене', 'error');
                });
        }

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || newPassword.length < 6) {
                return showMessage('Пароль має бути не менше 6 символів', 'error');
            }
            if (newPassword !== confirmPassword) {
                return showMessage('Паролі не співпадають', 'error');
            }

            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            const data = await res.json();

            if (data.success) {
                showMessage('Пароль успішно змінено! Тепер можеш увійти.', 'success');
                setTimeout(() => window.location.href = '/', 2000);
            } else {
                showMessage(data.message || 'Помилка', 'error');
            }
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = `message ${type}`;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
